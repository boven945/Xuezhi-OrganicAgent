# 本机演示编排：后端 + 前端
#
# 用途：一条命令跑起完整演示环境，且**密钥不出现在命令行**。
#
# 密钥来源：`.env`（已被 .gitignore 排除，见 §8）。
# 容器内不用 `docker run -e MAAS_API_KEY=xxx` 的原因：
# 命令行参数会进 shell 历史与 `docker inspect`，比 .env 更容易泄露。
#
# 用法：
#   docker compose up -d          # 启动
#   docker compose logs -f api    # 看后端日志
#   docker compose down           # 停止并清理
#
# 为什么用 compose 而非 run：
# 本项目此前一直用 `docker run`，结果每次都要手抄一长串参数
# （端口、挂载、PYTHONPATH、4 个环境变量），极易漏项——
# 实测踩过：漏了 PYTHONPATH 导致 `No module named 'app'`，
# 且报错信息完全指不到真正原因。见 docs/container-runtime-verification.md §3。

services:
  api:
    # 用已构建的测试镜像（含 RDKit 与全部依赖）。
    # 本机 RDKit 被应用控制策略拦截，只能在容器内跑（决策 H20）。
    image: xuezhi-chem-test
    container_name: xuezhi-llm
    command: >
      python -m uvicorn app.api.app:app
      --host 0.0.0.0 --port 8000
    environment:
      # 后端包在 /work/backend 下，故须显式指明
      PYTHONPATH: /work/backend
      XUEZHI_CHROMA_PATH: /work/data/chroma
      # 允许前端跨域。**刻意写明两个 origin**：
      # vite 默认起在 127.0.0.1，而用户可能在浏览器输 localhost，
      # 两者不同源，少一个就会被 CORS 挡掉（实测踩过）。
      XUEZHI_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      XUEZHI_AUDIO_DIR: /work/data/audio
      # 密钥从宿主 .env 注入，不在 compose 文件里写明文
      MAAS_API_KEY: ${MAAS_API_KEY:-}
      MAAS_BASE_URL: ${MAAS_BASE_URL:-https://api.modelarts-maas.com/openai/v1}
      MAAS_MODEL: ${MAAS_MODEL:-openpangu-2.0-flash}
      # 数字人人设：教师口吻。**必须在此透传**——
      # `LLMConfig.from_env()` 读的是容器内的环境变量，
      #宿主的 .env 不会自动进去（实测踩过：设了变量但容器里读不到，
      # 导致「开/关对照」两次都是同一个值，对照无效）。
      XUEZHI_PERSONA_ENABLED: ${XUEZHI_PERSONA_ENABLED:-false}
      # 数字人：向 Fay 推送讲解文本。
      # **默认可关**：Fay 是可选增强（architecture.md §6），
      # 关掉时语音朗读照常（本地 edge-tts），只是数字人不做动作。
      # 启用需同时起 Fay：`docker compose --profile fay up -d fay`。
      XUEZHI_FAY_ENABLED: ${XUEZHI_FAY_ENABLED:-false}
      # Fay 的 Flask HTTP（/transparent-pass）
      XUEZHI_FAY_URL: ${XUEZHI_FAY_URL:-http://host.docker.internal:5000}
    ports:
      - "8000:8000"
    volumes:
      # 源码挂载：改代码后 `--reload` 即可生效，不必重建镜像
      - ./backend:/work/backend
      - ./data:/work/data
    restart: unless-stopped

  web:
    image: node:22-alpine
    container_name: xuezhi-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # 容器内访问 api 服务名，不是 127.0.0.1
      VITE_BACKEND_URL: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules 必须用匿名卷，否则容器内的 Linux 二进制
      # 会覆盖宿主机的 Windows 安装（实测踩过：跨平台 node_modules）
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  # Fay 数字人服务。**默认不启动**——须显式 `docker compose --profile fay up -d fay`。
  #
  # 为什么要 profile：Fay 是**可选增强**（`architecture.md` §6
  # 语音与数字人均可降级）。默认启动会让「一条命令跑起演示环境」
  # 变成「一条命令拖起一个 2GB 镜像的第三方服务」，
  # 而它对问答、分子、3D、语音朗读**全都不是必需的**。
  fay:
    profiles: ["fay"]
    image: xuezhi-fay
    container_name: xuezhi-fay
    # **不设 restart: unless-stopped**——Fay 是可选服务，
    # 默认不启动的东西不该有自动重启策略，否则 docker compose up
    # 会把它一并拉起来。
    ports:
      # 10002：WebSocket 渲染端。前端数字人连这个
      - "10002:10002"
      # 5000：Flask HTTP（/transparent-pass 与管理页）
      - "5000:5000"
    environment:
      # Fay 的 simulation_engine 在**模块导入时**就构造
      # openai.OpenAI()，缺 key 直接崩（实测 2026-10-05）。
      #
      # ## 为什么不能用 MAAS_API_KEY 直接注入
      #
      # 实测 `utils/config_util.py:540`：
      # ```python
      # key_gpt_api_key = system_config.get('key', 'gpt_api_key', ...)
      # ```
      # **只从配置文件读，不读环境变量**。所以挂 MAAS_API_KEY 没用
      # （我第一版方案就是这样写的，实测无效后才改）。
      #
      # ## 用它官方支持的环境变量机制
      #
      # `config_util.py:105` 定义 `FAY_SYSTEM_CONF_JSON`，
      # 可把整份配置以 JSON 传入，优先级高于文件。
      # 实测 `expected_project_id` 为 None 时不校验 meta，
      # 故直接传 `{"key": {...}}` 即可。
      #
      # 密钥经 .env 注入，**不写进仓库文件**。
      FAY_SYSTEM_CONF_JSON: >-
        {"key":{"gpt_api_key":"${MAAS_API_KEY:-}",
        "gpt_base_url":"https://api.modelarts-maas.com/openai/v1",
        "gpt_model_engine":"openpangu-2.0-flash",
        "tts_module":"ms_tts_sdk"}}
      # 容器内无音频设备，抑制 ALSA 刷屏（实测刷了 8 行才到真错误）
      PYTHONWARNINGS: ignore
    volumes:
      - fay_data:/app/data
      # Fay 自带 ffmpeg 与口型分析 exe，架构相关，**不挂载宿主目录**
    restart: "no"

volumes:
  frontend_node_modules:
  fay_data:
